<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Limitless Lifting</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0c0e12 0%, #1a1d24 100%);
      color: #e8e8e8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .logo {
      width: 120px;
      height: 120px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      margin-bottom: 2rem;
      box-shadow: 0 20px 60px rgba(99, 102, 241, 0.3);
    }
    h1 {
      font-size: 2.5rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #6366f1, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .tagline {
      color: #9ca3af;
      font-size: 1.125rem;
      margin-bottom: 2rem;
      text-align: center;
    }
    .status {
      background: rgba(99, 102, 241, 0.1);
      border: 1px solid rgba(99, 102, 241, 0.3);
      border-radius: 12px;
      padding: 1.5rem 2rem;
      max-width: 500px;
      text-align: center;
    }
    .status h2 {
      color: #a78bfa;
      margin-bottom: 0.5rem;
    }
    .status p {
      color: #9ca3af;
      line-height: 1.6;
    }
    .spinner {
      width: 24px;
      height: 24px;
      border: 3px solid rgba(99, 102, 241, 0.3);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 1rem auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .links {
      margin-top: 2rem;
      display: flex;
      gap: 1rem;
    }
    .links a {
      color: #6366f1;
      text-decoration: none;
      padding: 0.75rem 1.5rem;
      border: 1px solid rgba(99, 102, 241, 0.3);
      border-radius: 8px;
      transition: all 0.2s;
    }
    .links a:hover {
      background: rgba(99, 102, 241, 0.1);
      border-color: #6366f1;
    }
  </style>
</head>
<body>
  <div class="logo">&#127947;</div>
  <h1>Limitless Lifting</h1>
  <p class="tagline">Track your workouts, build your strength</p>
  <div class="status">
    <h2>Coming Soon</h2>
    <div class="spinner"></div>
    <p>The full app is being deployed. Check back shortly.</p>
  </div>
  <div class="links">
    <a href="https://github.com/Tomiboyg/limitless-lifting">GitHub</a>
    <a href="https://supabase.com">Supabase</a>
  </div>
</body>
</html>
